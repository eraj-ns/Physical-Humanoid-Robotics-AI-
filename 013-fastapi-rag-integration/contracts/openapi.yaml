openapi: 3.0.0
info:
  title: RAG Agent API
  description: API for interacting with the RAG agent
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /query:
    post:
      summary: Process a user query using the RAG agent
      description: Sends a query to the RAG agent for processing and returns the response with sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Successful response from the RAG agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad request - invalid query format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    QueryRequest:
      type: object
      properties:
        query:
          type: string
          description: The user's question or query text
          example: "What is ROS 2?"
      required:
        - query
    AgentResponse:
      type: object
      properties:
        content:
          type: string
          description: The agent's response content
          example: "ROS 2 is a flexible framework for writing robot applications..."
        sources:
          type: array
          description: List of sources used to generate the response
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the source
                example: "doc_123"
              url:
                type: string
                description: URL of the source document
                example: "https://example.com/doc"
              text:
                type: string
                description: Preview text of the source content
                example: "ROS 2 is a flexible framework..."
        confidence:
          type: string
          description: Confidence level of the response
          enum: [high, medium, low]
          example: "high"
        follow_up_questions:
          type: array
          description: Suggested follow-up questions
          items:
            type: string
          example: ["What are the key features of ROS 2?", "How does ROS 2 differ from ROS 1?"]
      required:
        - content
        - sources
        - confidence
    APIError:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid query format"
        status_code:
          type: integer
          description: HTTP status code
          example: 400
        details:
          type: object
          description: Additional error details
          example: {"field": "query", "reason": "cannot be empty"}
      required:
        - error
        - status_code