openapi: 3.0.0
info:
  title: RAG Agent API
  description: API specification for the RAG Agent with Qdrant integration
  version: 1.0.0
paths:
  /query:
    post:
      summary: Submit a query to the RAG agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The user's question or request
                  example: "What are the key concepts in Chapter 1?"
                thread_id:
                  type: string
                  description: Optional thread ID for follow-up queries
                  example: "thread_abc123"
      responses:
        '200':
          description: Successful response from the agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                    description: The agent's response
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Source document ID
                        text:
                          type: string
                          description: Snippet of source content
                        score:
                          type: number
                          description: Relevance score
                        source_url:
                          type: string
                          description: URL of the source
                  confidence:
                    type: string
                    description: Confidence level in the response
                    enum: [high, medium, low]
        '400':
          description: Bad request - invalid query format
        '500':
          description: Internal server error
components:
  schemas:
    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The user's question or request
        thread_id:
          type: string
          description: Optional thread ID for follow-up queries
    AgentResponse:
      type: object
      properties:
        content:
          type: string
          description: The agent's response
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        confidence:
          type: string
          enum: [high, medium, low]
    Source:
      type: object
      properties:
        id:
          type: string
          description: Source document ID
        text:
          type: string
          description: Snippet of source content
        score:
          type: number
          description: Relevance score
        source_url:
          type: string
          description: URL of the source